name: Build, Publish, and Release Docker Image

on:
  push:
    branches: ['main', 'rust-engine', 'unified']
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_REPO: omnibus

jobs:
  # --- 1. THE GATEKEEPER: Run tests before touching Docker ---
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
      - name: Run Tests
        # Runs the suite silently as a pass/fail gatekeeper
        run: npm run test

  # --- 2. THE PUBLISHER: Build and Push ---
  build-and-push-image:
    needs: test # <-- CRITICAL: This tells Docker to wait for tests to pass!
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- AUTOMATED RELEASE STEPS (main only: branch builds publish images, never releases) ---
      - name: Get version from package.json
        id: package-version
        run: echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV

      - name: Check if Release exists
        if: github.ref == format('refs/heads/{0}', 'main')
        id: check-release
        run: |
          if gh release view v${{ env.VERSION }} &>/dev/null; then
            echo "EXISTS=true" >> $GITHUB_ENV
          else
            echo "EXISTS=false" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: github.ref == format('refs/heads/{0}', 'main') && env.EXISTS == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          name: Omnibus v${{ env.VERSION }}
          body: |
            ${{ github.event.head_commit.message || 'Automated release for version update.' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- DOCKER BUILD STEPS ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=v${{ env.VERSION }},enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            # The rust-engine branch publishes side-by-side test images; it never touches :latest.
            type=raw,value=rust-engine,enable=${{ github.ref == format('refs/heads/{0}', 'rust-engine') }}
            type=raw,value=v${{ env.VERSION }}-rust,enable=${{ github.ref == format('refs/heads/{0}', 'rust-engine') }}
            # The unified (dual-DB) test branch publishes under :unified; it never touches :latest.
            type=raw,value=unified,enable=${{ github.ref == format('refs/heads/{0}', 'unified') }}
            type=raw,value=v${{ env.VERSION }}-unified,enable=${{ github.ref == format('refs/heads/{0}', 'unified') }}
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CACHEBUST=${{ github.run_id }}

      - name: Update Docker Hub Description
        if: success() && github.ref == format('refs/heads/{0}', 'main')
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO }}
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README-docker.md

      # --- DOCKER DISCORD NOTIFICATION ---
      - name: Send Discord Notification (Docker Published)
        if: success() 
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_BUILDS }}
        run: |
          COMMIT_SHORT="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          VERSION="v${{ env.VERSION }}"
          
          PAYLOAD=$(jq -n \
            --arg title "🐳 Docker Image Published" \
            --arg desc "Omnibus $VERSION has been built and published to GHCR and Docker Hub." \
            --arg version "$VERSION" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "\`$COMMIT_SHORT\`" \
            --arg pull "\`\`\`docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest\`\`\`" \
            --arg footer "Omnibus $VERSION • Built with GitHub Actions" \
            --arg time "$TIMESTAMP" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 3447003,
                fields: [
                  { name: "🏷️ Version", value: $version, inline: true },
                  { name: "🌿 Branch", value: $branch, inline: true },
                  { name: "🔗 Commit", value: $commit, inline: true },
                  { name: "💻 Pull Command", value: $pull, inline: false }
                ],
                footer: { text: $footer },
                timestamp: $time
              }]
            }' \
          )
          
          curl -H "Content-Type: application/json" -d "$PAYLOAD" $DISCORD_WEBHOOK

      # --- SPECIFIC RELEASE NOTIFICATION (PLAIN TEXT FORMAT, main only) ---
      - name: Send Release Announcement to Discord
        if: success() && github.ref == format('refs/heads/{0}', 'main')
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASES }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ env.VERSION }}"
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$VERSION"
          
          # Fetch the release body/notes using GitHub CLI
          RELEASE_NOTES=$(gh release view $VERSION --json body -q ".body")
          
          # Check length and truncate if it exceeds 1500 characters
          if [ ${#RELEASE_NOTES} -gt 1500 ]; then
            # Using $'\n' to ensure Bash passes actual newlines into the variable
            RELEASE_NOTES="${RELEASE_NOTES:0:1500}..."$'\n\n'"*(Notes truncated due to Discord limits. [Click here to view full release notes]($RELEASE_URL))*"
          fi
          
          # Construct the payload using jq's native string interpolation \(var)
          # This guarantees that newlines inside the jq string are properly formatted for JSON
          PAYLOAD=$(jq -n \
            --arg version "$VERSION" \
            --arg url "$WORKFLOW_URL" \
            --arg notes "$RELEASE_NOTES" \
            --arg image "ghcr.io/${{ env.IMAGE_NAME }}:latest" \
            '{ 
              content: "🎉 **Release \($version)**\n\n\($url)\n\n\($notes)\n\n**Upgrade:**\n```bash\ndocker compose pull\ndocker compose down\ndocker compose up -d\n```" 
            }' \
          )
          
          # Send to Discord and fail with body if rejected
          curl --fail-with-body -H "Content-Type: application/json" -d "$PAYLOAD" $DISCORD_RELEASE_WEBHOOK

  # --- 3. THE ENGINE GATEKEEPER: lint + test the Rust engine before building its image ---
  test-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omnibus-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Pinned so a future stable clippy can't turn `-D warnings` red with no code change.
          toolchain: "1.96.0"
          components: clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: omnibus-engine
      - name: Install C build deps (unrar / bzip2 / libwebp)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev pkg-config
      - name: Clippy + Test
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Surface a gate failure to Discord: when this job fails, build-and-push-engine is SKIPPED (so its
      # own failure ping never fires) and the engine image is NOT rebuilt — without this, only the web
      # image's success ping would fire and the engine would silently keep reporting the previous version.
      - name: Send Discord Notification (Engine CI Gate Failed)
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_BUILDS }}
        run: |
          COMMIT_SHORT="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(jq -n \
            --arg title "🔴 Engine CI Gate Failed" \
            --arg desc "Engine clippy/tests failed on \`${{ github.ref_name }}\` — the engine image was NOT rebuilt and will keep reporting the previous version. (The web image may still publish.)" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "\`$COMMIT_SHORT\`" \
            --arg run "[View run]($RUN_URL)" \
            --arg footer "Omnibus Engine • GitHub Actions" \
            --arg time "$TIMESTAMP" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 15158332,
                fields: [
                  { name: "🌿 Branch", value: $branch, inline: true },
                  { name: "🔗 Commit", value: $commit, inline: true },
                  { name: "🔎 Logs", value: $run, inline: false }
                ],
                footer: { text: $footer },
                timestamp: $time
              }]
            }' \
          )

          curl -H "Content-Type: application/json" -d "$PAYLOAD" $DISCORD_WEBHOOK

  # --- 4. THE ENGINE PUBLISHER: build & push the Rust engine image ---
  build-and-push-engine:
    needs: test-engine # Wait for the engine lint/test gate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from package.json
        run: echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for the engine image
        id: meta-engine
        uses: docker/metadata-action@v5
        with:
          # GHCR only: GHCR auto-creates the package on first push (packages: write), so there is no
          # Docker Hub repo to pre-create. docker-compose.yml pulls the engine from GHCR by default.
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-engine
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=v${{ env.VERSION }},enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            # The rust-engine branch is currently a source of engine builds; tagged per-branch
            # so the eventual merge to main can own :latest cleanly.
            type=raw,value=rust-engine,enable=${{ github.ref == format('refs/heads/{0}', 'rust-engine') }}
            type=raw,value=v${{ env.VERSION }}-rust,enable=${{ github.ref == format('refs/heads/{0}', 'rust-engine') }}
            # The unified (dual-DB) test branch publishes the engine under :unified.
            type=raw,value=unified,enable=${{ github.ref == format('refs/heads/{0}', 'unified') }}
            type=raw,value=v${{ env.VERSION }}-unified,enable=${{ github.ref == format('refs/heads/{0}', 'unified') }}
            type=ref,event=tag
            type=sha

      - name: Build and push the engine image
        uses: docker/build-push-action@v5
        with:
          context: ./omnibus-engine
          push: true
          tags: ${{ steps.meta-engine.outputs.tags }}
          labels: ${{ steps.meta-engine.outputs.labels }}
          # Bake the release version into the image so /health can report it for drift detection.
          build-args: |
            OMNIBUS_VERSION=${{ env.VERSION }}
          # Separate cache scope so the engine and Node images don't evict each other.
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine

      # --- ENGINE DISCORD NOTIFICATIONS ---
      # Independent of the web image's ping so a failed/skipped engine build can't hide behind the web's
      # "Docker Image Published" success notification — the exact failure mode that left the engine on a
      # stale version while the web image advanced.
      - name: Send Discord Notification (Engine Published)
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_BUILDS }}
        run: |
          COMMIT_SHORT="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          VERSION="v${{ env.VERSION }}"
          if [ "${{ github.ref_name }}" = "main" ]; then ENGINE_TAG="latest"; else ENGINE_TAG="${{ github.ref_name }}"; fi

          PAYLOAD=$(jq -n \
            --arg title "🐳 Engine Image Published" \
            --arg desc "Omnibus Engine $VERSION has been built and published to GHCR." \
            --arg version "$VERSION" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "\`$COMMIT_SHORT\`" \
            --arg pull "\`\`\`docker pull ghcr.io/${{ env.IMAGE_NAME }}-engine:$ENGINE_TAG\`\`\`" \
            --arg footer "Omnibus Engine $VERSION • Built with GitHub Actions" \
            --arg time "$TIMESTAMP" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 3066993,
                fields: [
                  { name: "🏷️ Version", value: $version, inline: true },
                  { name: "🌿 Branch", value: $branch, inline: true },
                  { name: "🔗 Commit", value: $commit, inline: true },
                  { name: "💻 Pull Command", value: $pull, inline: false }
                ],
                footer: { text: $footer },
                timestamp: $time
              }]
            }' \
          )

          curl -H "Content-Type: application/json" -d "$PAYLOAD" $DISCORD_WEBHOOK

      - name: Send Discord Notification (Engine Build Failed)
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_BUILDS }}
        run: |
          COMMIT_SHORT="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          VERSION="v${{ env.VERSION }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(jq -n \
            --arg title "🔴 Engine Image Build FAILED" \
            --arg desc "Omnibus Engine $VERSION failed to build or push. The web image may have shipped without it, leaving the engine on a stale version until this is fixed." \
            --arg version "$VERSION" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "\`$COMMIT_SHORT\`" \
            --arg run "[View run]($RUN_URL)" \
            --arg footer "Omnibus Engine $VERSION • GitHub Actions" \
            --arg time "$TIMESTAMP" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 15158332,
                fields: [
                  { name: "🏷️ Version", value: $version, inline: true },
                  { name: "🌿 Branch", value: $branch, inline: true },
                  { name: "🔗 Commit", value: $commit, inline: true },
                  { name: "🔎 Logs", value: $run, inline: false }
                ],
                footer: { text: $footer },
                timestamp: $time
              }]
            }' \
          )

          curl -H "Content-Type: application/json" -d "$PAYLOAD" $DISCORD_WEBHOOK