# Omnibus (Rust-engine branch) — QNAP Container Station deployment
#
# Paste this into Container Station → Applications → Create, or run
# `docker compose -f docker-compose.qnap.yml up -d` over SSH.
#
# This stack is fully independent of a production Omnibus container running on the
# same NAS: different container names, its own Postgres/Redis, and the web UI on
# host port 3001 (production typically owns 3000).
#
# BEFORE FIRST START:
#   1. Replace every /share/Container/omnibus-rust/... path with real NAS folders.
#   2. Point BOTH the web and engine services at the SAME library mount. Use a TEST
#      COPY of your library — the engine converts CBR→CBZ (deleting originals),
#      embeds ComicInfo.xml, and renames files. Do not point it at production data
#      until you trust it.
#   3. Set NEXTAUTH_SECRET to a long random string (same value reaches web + engine).
#   4. The ghcr.io/hankscafe/omnibus-engine package must be public (or add GHCR
#      credentials in Container Station) — new GHCR packages default to private.

services:
  db:
    image: postgres:15-alpine
    container_name: omnibus_rust_db
    restart: always
    environment:
      POSTGRES_USER: omnibus
      POSTGRES_PASSWORD: omnibus_password
      POSTGRES_DB: omnibus
    # No host port: only this stack's containers need to reach it.
    volumes:
      - /share/Container/omnibus-rust/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnibus -d omnibus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: omnibus_rust_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  omnibus-engine:
    image: ghcr.io/hankscafe/omnibus-engine:rust-engine
    container_name: omnibus_rust_engine
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://omnibus:omnibus_password@db:5432/omnibus?schema=public
      OMNIBUS_ENGINE_BIND: 0.0.0.0:8000
      OMNIBUS_NODE_URL: http://web:3000
      # IMPORTANT: must match the web service's NEXTAUTH_SECRET (engine auth + backup encryption).
      NEXTAUTH_SECRET: change_me_to_a_long_random_string
      OMNIBUS_BACKUPS_DIR: /config/backups
      OMNIBUS_CACHE_DIR: /config/cache
      OMNIBUS_WATCHED_DIR: /data/watched
      OMNIBUS_AWAITING_MATCH_DIR: /data/unmatched
    # No host port: only the web container talks to the engine.
    volumes:
      - /share/Container/omnibus-rust/config:/config
      - /share/Container/omnibus-rust/data:/data
      # Library mount — MUST be identical in web + engine so both resolve the same paths.
      - /share/Comics-RustTest:/comics

  web:
    image: ghcr.io/hankscafe/omnibus:rust-engine
    container_name: omnibus_rust_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      omnibus-engine:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://omnibus:omnibus_password@db:5432/omnibus?schema=public
      OMNIBUS_REDIS_URL: redis://redis:6379
      OMNIBUS_ENGINE_URL: http://omnibus-engine:8000
      NEXTAUTH_SECRET: change_me_to_a_long_random_string
      # Set to how you reach the UI in a browser (NAS IP + the host port below).
      NEXTAUTH_URL: http://192.168.1.100:3001
      OMNIBUS_BACKUPS_DIR: /config/backups
      OMNIBUS_CACHE_DIR: /config/cache
      OMNIBUS_LOGS_DIR: /config/logs
      OMNIBUS_WATCHED_DIR: /data/watched
      OMNIBUS_AWAITING_MATCH_DIR: /data/unmatched
    ports:
      - "3001:3000"
    volumes:
      - /share/Container/omnibus-rust/config:/config
      - /share/Container/omnibus-rust/data:/data
      - /share/Comics-RustTest:/comics
