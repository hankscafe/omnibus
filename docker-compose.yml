# ============================================================================
# Omnibus — STANDARD profile (zero-config SQLite).
#
# Three services: the Next.js web app, the Rust engine, and Redis (BullMQ queue).
# The database is a single SQLite file on the shared /config volume — no database
# server to run or configure. This is the recommended profile for most self-hosters.
#
# Want PostgreSQL for a very large library? Use the scale profile instead:
#     docker compose -f docker-compose.postgres.yml up -d
#
# The web app and the engine BOTH open the same SQLite file, so they MUST share the
# /config volume (below). The engine opens it in WAL mode with a busy-timeout so the
# two processes coexist; keep /config on a real local/bind mount, NOT a network share
# (SMB/NFS file locking is unreliable for SQLite).
# ============================================================================
services:
  # --- Redis: the background job queue (BullMQ) ---
  redis:
    image: redis:7-alpine
    container_name: omnibus_redis
    restart: always
    # Not published to the host: only the web container (BullMQ) reaches Redis over the compose network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Rust engine: heavy/parallel backend tasks (scan, convert, metadata, search, backup) ---
  omnibus-engine:
    # Pull the published stable image by default; `docker compose build` rebuilds from source.
    # (Override via OMNIBUS_ENGINE_IMAGE, e.g. ...omnibus-engine:dev for the edge channel.)
    image: ${OMNIBUS_ENGINE_IMAGE:-ghcr.io/hankscafe/omnibus-engine:latest}
    build: ./omnibus-engine
    container_name: omnibus_engine
    restart: always
    environment:
      # SQLite file on the shared /config volume — same path the web app uses.
      DATABASE_URL: file:/config/omnibus.db
      OMNIBUS_ENGINE_BIND: 0.0.0.0:8000
      # The engine calls back to the Node web app to fire detached-job completion notifications.
      OMNIBUS_NODE_URL: http://web:3000
      # IMPORTANT: must match the Node app's NEXTAUTH_SECRET, or AES-encrypted DB backups can't be
      # restored. No insecure default — the engine refuses to start network-exposed without a real
      # secret. Generate one with: openssl rand -base64 48
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in your .env to a long random string shared by web and engine}
      OMNIBUS_BACKUPS_DIR: /config/backups
      OMNIBUS_CACHE_DIR: /config/cache
      OMNIBUS_WATCHED_DIR: /data/watched
      OMNIBUS_AWAITING_MATCH_DIR: /data/unmatched
      # Optional (*arr convention): default permission mask for files/folders the engine creates.
      # One UMASK value in your .env feeds both services. Empty/unset = unchanged defaults.
      UMASK: ${UMASK:-}
    # No host port: the web container reaches the engine at http://omnibus-engine:8000 over the
    # compose network. Publishing 8000 would expose the DB-/filesystem-mutating engine API to the LAN.
    # The engine scans/converts/embeds files on disk AND shares the SQLite DB, so it MUST share the
    # SAME config + data volumes as the web app. For a real deploy, replace these named volumes with
    # host bind mounts to your storage (e.g. /mnt/nas/config:/config and /mnt/nas/data:/data).
    volumes:
      - config:/config
      - data:/data

  # --- Node / Next.js web app: the UI + API; forwards heavy jobs to omnibus-engine ---
  web:
    # Pull the published stable image by default; `docker compose build` rebuilds from source.
    # (Override via OMNIBUS_IMAGE, e.g. ...omnibus:dev for the edge channel.)
    image: ${OMNIBUS_IMAGE:-ghcr.io/hankscafe/omnibus:latest}
    build: .
    container_name: omnibus_web
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      omnibus-engine:
        condition: service_started
    environment:
      # Same SQLite file as the engine (shared /config volume). A file: URL selects the SQLite
      # provider automatically (the entrypoint bakes the SQLite client; no regeneration needed).
      DATABASE_URL: file:/config/omnibus.db
      OMNIBUS_REDIS_URL: redis://redis:6379
      # Reach the Rust engine over the compose network (NOT 127.0.0.1).
      OMNIBUS_ENGINE_URL: http://omnibus-engine:8000
      # Must match the engine's NEXTAUTH_SECRET, or AES-encrypted DB backups can't be restored.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in your .env to a long random string shared by web and engine}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Keep these paths identical to the engine so both containers resolve the same files.
      OMNIBUS_BACKUPS_DIR: /config/backups
      OMNIBUS_CACHE_DIR: /config/cache
      OMNIBUS_LOGS_DIR: /config/logs
      OMNIBUS_WATCHED_DIR: /data/watched
      OMNIBUS_AWAITING_MATCH_DIR: /data/unmatched
      # Optional (*arr convention): default permission mask for everything Omnibus creates. On
      # NAS/shared storage new folders are otherwise 0755 — read-only for other accounts. 000 =
      # world-writable (0777 folders), 002 = group-writable (0775). Also normalizes folders the
      # Smart Matcher relocates. Set the same value on the engine service (one .env entry feeds
      # both). Empty/unset = unchanged defaults.
      UMASK: ${UMASK:-}
    ports:
      - "3000:3000"
    # Shares the SAME config + data volumes as omnibus-engine so both containers see the files
    # (including the SQLite database at /config/omnibus.db).
    volumes:
      - config:/config
      - data:/data

volumes:
  config:
  data:
