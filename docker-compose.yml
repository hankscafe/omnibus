services:
  db:
    image: postgres:15-alpine
    container_name: omnibus_postgres
    restart: always
    environment:
      POSTGRES_USER: omnibus
      POSTGRES_PASSWORD: omnibus_password
      POSTGRES_DB: omnibus
    # Not published to the host: only the web + engine containers reach Postgres over the compose
    # network. To use a DB GUI from the host, add `ports: ["127.0.0.1:5432:5432"]` (loopback only).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnibus -d omnibus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- ADD THIS REDIS BLOCK ---
  redis:
    image: redis:7-alpine
    container_name: omnibus_redis
    restart: always
    # Not published to the host: only the web container (BullMQ) reaches Redis over the compose network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Rust engine: heavy/parallel backend tasks (scan, convert, metadata, search, backup) ---
  omnibus-engine:
    # Pull the published engine image by default; `docker compose build` still rebuilds from source.
    # NOTE: pinned to the rust-engine branch images while this branch lives separately from main;
    # switch both image defaults back to :latest when the branch merges.
    image: ${OMNIBUS_ENGINE_IMAGE:-ghcr.io/hankscafe/omnibus-engine:rust-engine}
    build: ./omnibus-engine
    container_name: omnibus_engine
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://omnibus:omnibus_password@db:5432/omnibus?schema=public
      OMNIBUS_ENGINE_BIND: 0.0.0.0:8000
      # The engine calls back to the Node web app to fire detached-job completion notifications.
      OMNIBUS_NODE_URL: http://web:3000
      # IMPORTANT: must match the Node app's NEXTAUTH_SECRET, or AES-encrypted DB backups can't be
      # restored. No insecure default — the engine refuses to start network-exposed without a real
      # secret. Generate one with: openssl rand -base64 48
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in your .env to a long random string shared by web and engine}
      OMNIBUS_BACKUPS_DIR: /config/backups
      OMNIBUS_CACHE_DIR: /config/cache
      OMNIBUS_WATCHED_DIR: /data/watched
      OMNIBUS_AWAITING_MATCH_DIR: /data/unmatched
    # No host port: the web container reaches the engine at http://omnibus-engine:8000 over the
    # compose network. Publishing 8000 would expose the DB-/filesystem-mutating engine API to the LAN.
    # The engine scans/converts/embeds files on disk, so it MUST share the SAME config + data
    # volumes as the web app. For a real deploy, replace these named volumes with host bind mounts
    # to your storage (e.g. /mnt/nas/config:/config and /mnt/nas/data:/data).
    volumes:
      - config:/config
      - data:/data

  # --- Node / Next.js web app: the UI + API; forwards heavy jobs to omnibus-engine ---
  web:
    # Pull the published image by default; `docker compose build` still rebuilds from source.
    # Pinned to the rust-engine branch image (see note on omnibus-engine above).
    image: ${OMNIBUS_IMAGE:-ghcr.io/hankscafe/omnibus:rust-engine}
    build: .
    container_name: omnibus_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      omnibus-engine:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://omnibus:omnibus_password@db:5432/omnibus?schema=public
      OMNIBUS_REDIS_URL: redis://redis:6379
      # Reach the Rust engine over the compose network (NOT 127.0.0.1).
      OMNIBUS_ENGINE_URL: http://omnibus-engine:8000
      # Must match the engine's NEXTAUTH_SECRET, or AES-encrypted DB backups can't be restored.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in your .env to a long random string shared by web and engine}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Keep these paths identical to the engine so both containers resolve the same files.
      OMNIBUS_BACKUPS_DIR: /config/backups
      OMNIBUS_CACHE_DIR: /config/cache
      OMNIBUS_LOGS_DIR: /config/logs
      OMNIBUS_WATCHED_DIR: /data/watched
      OMNIBUS_AWAITING_MATCH_DIR: /data/unmatched
    ports:
      - "3000:3000"
    # Shares the SAME config + data volumes as omnibus-engine so both containers see the files.
    volumes:
      - config:/config
      - data:/data

volumes:
  pgdata:
  config:
  data: